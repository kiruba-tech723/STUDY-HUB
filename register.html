<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - StudyHub</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav-bar">
      <a href="index.html" class="brand">📚 StudyHub</a>
      <ul class="nav-links" data-drawer>
        <li><a href="index.html">Home</a></li>
        <li><a href="signin.html">Sign In</a></li>
        <li><a href="home.html">Dashboard</a></li>
      </ul>
      <div>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
        <button class="icon-btn hamburger" id="hamburger" aria-label="Open menu">☰</button>
      </div>
    </nav>
  </header>

  <main class="form-wrap">
    <div class="card">
      <h1>Student Registration</h1>
      <div class="success-banner" id="successMsg">Registration successful! Redirecting to Sign In...</div>

      <form data-validate novalidate>
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" data-check placeholder="e.g. Kirubakaran M">
          <span class="error-msg"></span>
        </div>

        <div class="form-group">
          <label for="empId">Register ID</label>
          <input type="text" id="empId" data-check placeholder="6-12 letters/digits">
          <span class="error-msg"></span>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" data-check placeholder="name@example.com">
          <span class="error-msg"></span>
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <input type="text" id="mobile" data-check placeholder="10-digit number" maxlength="10">
          <span class="error-msg"></span>
        </div>

        <div class="form-group">
          <label for="dept">Division</label>
          <select id="dept" data-check>
            <option value="">-- Select Division --</option>
            <option value="cse">Computer Science &amp; Engineering</option>
            <option value="ece">Electronics &amp; Communication</option>
            <option value="eee">Electrical &amp; Electronics</option>
            <option value="mech">Mechanical Engineering</option>
            <option value="civil">Civil Engineering</option>
          </select>
          <span class="error-msg"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" data-check placeholder="Min 8 characters">
          <span class="error-msg"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" data-check placeholder="Re-enter password">
          <span class="error-msg"></span>
        </div>

        <button type="submit" class="btn" disabled>Submit</button>
      </form>
      <p class="form-note">Already registered? <a href="signin.html">Sign In</a></p>
    </div>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
