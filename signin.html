<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - StudyHub</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav-bar">
      <a href="index.html" class="brand">📚 StudyHub</a>
      <ul class="nav-links" data-drawer>
        <li><a href="index.html">Home</a></li>
        <li><a href="register.html">Register</a></li>
        <li><a href="signup.html">Sign Up</a></li>
      </ul>
      <div>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
        <button class="icon-btn hamburger" id="hamburger" aria-label="Open menu">☰</button>
      </div>
    </nav>
  </header>

  <main class="form-wrap">
    <div class="card">
      <h1>Sign In</h1>
      <div class="alert-banner" id="loginAlert" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="pw-box">
            <input type="password" id="password" placeholder="Your password">
            <button type="button" class="eye-btn" id="eyeBtn" aria-label="Show or hide password">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn">Sign In</button>
      </form>
      <p class="form-note">New here? <a href="register.html">Register</a> or <a href="signup.html">Sign Up</a></p>
    </div>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
